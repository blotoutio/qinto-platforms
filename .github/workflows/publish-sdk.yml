name: Publish SDK

# Manually triggered: the selected package is the folder it publishes from. Add a folder to the
# options below when a new platform package lands.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package folder to publish
        required: true
        type: choice
        options:
          - medusa
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# contents: write lets the run push the version commit and tag.
# id-token is the npm credential: trusted publishing exchanges this run's OIDC token for a
# short-lived registry token, and attaches provenance on its own — there is no npm secret.
permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.package }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The dispatch form lets any branch be picked; only main's code ships under our name.
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - uses: actions/checkout@v7

      # registry-url points npm at npmjs.org for the OIDC exchange.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ inputs.package }}/package-lock.json
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+; pin to the package's declared packageManager.
      - name: Install npm from packageManager
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      # The build in prepublishOnly needs the medusa CLI from devDependencies.
      - run: npm ci

      # Tags are prefixed with the folder because every package in this repo shares one tag list.
      # The tag is pushed before publishing so every version on npm has a matching commit.
      - name: Bump version and tag
        run: |
          version="$(npm version ${{ inputs.bump }} --no-git-tag-version)"
          tag="${{ inputs.package }}-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${{ inputs.package }}): release ${version}"
          git tag "${tag}"
          git push origin HEAD "${tag}"

      # prepublishOnly runs the build here, so the tarball can never carry a stale build.
      - run: npm publish --access public
